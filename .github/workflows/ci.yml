name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    runs-on: ubuntu-latest

    # 테스트용 MySQL (매번 빈 DB로 시작, 끝나면 사라짐)
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: stockmate
          MYSQL_USER: stockmate
          MYSQL_PASSWORD: stockmate1234
          MYSQL_ROOT_PASSWORD: root1234
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -proot1234"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20

    steps:
      - name: 코드 받기
        uses: actions/checkout@v5

      - name: Java 21 설치
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Gradle 설정 (의존성 캐시)
        uses: gradle/actions/setup-gradle@v5

      - name: gradlew 실행 준비
        run: sed -i 's/\r$//' gradlew && chmod +x gradlew

      - name: 테스트
        run: ./gradlew test --no-daemon

      - name: docker-compose 문법 검사
        run: docker compose config --quiet
        env:
          DB_USERNAME: ci
          DB_PASSWORD: ci
          DB_ROOT_PASSWORD: ci
          JWT_SECRET: ci