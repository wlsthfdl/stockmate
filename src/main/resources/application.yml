spring:
  application:
    name: stockmate
  profiles:
    default: local       # 프로필을 따로 지정하지 않으면 local로 실행 (IntelliJ, 테스트)

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    properties:
      hibernate:
        default_batch_fetch_size: 100
    open-in-view: false

server:
  port: 8080

jwt:
  expiration: 86400000      # 24시간(밀리초 단위)