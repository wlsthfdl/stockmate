name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    runs-on: ubuntu-latest

    # 테스트용 MySQL (매번 빈 DB로 시작, 끝나면 사라짐)
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: stockmate
          MYSQL_USER: stockmate
          MYSQL_PASSWORD: stockmate1234
          MYSQL_ROOT_PASSWORD: root1234
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -proot1234"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20

    steps:
      - name: 코드 받기
        uses: actions/checkout@v5

      - name: Java 21 설치
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Gradle 설정 (의존성 캐시)
        uses: gradle/actions/setup-gradle@v5

      - name: gradlew 실행 준비
        run: sed -i 's/\r$//' gradlew && chmod +x gradlew

      - name: 테스트
        run: ./gradlew test --no-daemon

      - name: docker-compose 문법 검사
        run: docker compose config --quiet
        env:
          DB_USERNAME: ci
          DB_PASSWORD: ci
          DB_ROOT_PASSWORD: ci
          JWT_SECRET: ci

  deploy:
    needs: test   # test가 성공해야만 실행
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'   # master 푸시일 때만 (PR은 테스트만)
    runs-on: ubuntu-latest
    concurrency: deploy   # 배포가 겹치지 않게 한 번에 하나씩

    steps:
      - name: SSH 키 준비
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: 서버에 배포
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'EOF'
            set -e
            cd ~/stockmate
            git fetch origin master
            git reset --hard origin/master
            docker compose up -d --build
            docker image prune -f

            echo "앱 응답 확인 중..."
            for i in $(seq 1 60); do
              code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8080/products || true)
              if [ "$code" = "401" ]; then
                echo "배포 성공 (응답 코드 $code)"
                exit 0
              fi
              sleep 3
            done
            echo "앱이 3분 안에 응답하지 않음"
            docker compose logs --tail 50 app
            exit 1
          EOF