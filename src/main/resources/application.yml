spring:
  application:
    name: stockmate
  profiles:
    default: local       # 프로필을 따로 지정하지 않으면 local로 실행 (IntelliJ, 테스트)

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver

  flyway:
    baseline-on-migrate: true   # 테이블은 있는데 Flyway 기록이 없으면 V1까지 적용된 걸로 표시
    baseline-version: 1

  jpa:
    properties:
      hibernate:
        default_batch_fetch_size: 100
    open-in-view: false

server:
  port: 8080

jwt:
  expiration: 86400000      # 24시간(밀리초 단위)